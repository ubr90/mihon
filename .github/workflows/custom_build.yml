name: Custom APK
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: custom-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Signing config
        run: |
          cat > keystore.properties <<PROPS
          storeFile=../.github/custom.keystore
          storePassword=mihoncustom
          keyAlias=custom
          keyPassword=mihoncustom
          PROPS

      - name: Build APK
        run: |
          set -o pipefail
          ./gradlew assembleRelease -Pdist=ci -Pinclude-telemetry=false -Penable-updater=false 2>&1 | tee build.log

      - name: Report errors
        if: failure()
        run: |
          { grep -E "^e: " build.log | head -6; grep -v "^> Task\|^\s*$\|^w: " build.log | tail -25; } > err.txt
          i=0
          while IFS= read -r line; do
            i=$((i+1))
            echo "::error title=L$i::${line}"
          done < <(head -10 err.txt)
          # remaining lines bundled into one annotation
          msg=$(tail -n +11 err.txt | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::warning title=rest::${msg}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mihon-custom-apk
          path: app/build/outputs/apk/release/app-arm64-v8a-release.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk mihon-custom.apk
          gh release delete latest-custom --yes --cleanup-tag || true
          gh release create latest-custom mihon-custom.apk \
            --title "Mihon Custom $(date -u +%Y-%m-%d)" \
            --notes "Built from ${GITHUB_SHA::7}" --latest
